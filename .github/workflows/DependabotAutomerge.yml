name: "Dependabot Automerge - Action"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  worker:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Wait for status checks
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) throw new Error("No pull_request payload");
            
            // Wait up to 5 minutes for checks to complete
            const maxAttempts = 30;
            const delayMs = 10000; // 10 seconds
            
            for (let i = 0; i < maxAttempts; i++) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha
              });
              
              const allComplete = checks.check_runs.every(
                check => check.status === 'completed'
              );
              
              if (allComplete && checks.check_runs.length > 0) {
                const allSuccess = checks.check_runs.every(
                  check => check.conclusion === 'success' || check.conclusion === 'skipped'
                );
                
                if (allSuccess) {
                  console.log('All checks passed!');
                  break;
                } else {
                  throw new Error('Some checks failed');
                }
              }
              
              console.log(`Waiting for checks... (${i + 1}/${maxAttempts})`);
              await new Promise(resolve => setTimeout(resolve, delayMs));
            }

      - name: Merge PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash'
            });
