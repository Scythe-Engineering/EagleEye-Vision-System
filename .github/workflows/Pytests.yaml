name: Run EagleEye Tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: ${{ github.workspace }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: 3.11

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  cache-dependency-glob: uv.lock

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust builds
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src/rust_implementations/modules

            - name: Install dependencies
              run: uv sync

            - name: Build WebUI assets
              run: |
                  npm ci
                  npm run build

            - name: Run pytest
              run: uv run pytest
