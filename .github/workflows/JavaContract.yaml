name: Verify Java localization contract

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
            - name: Build desktop example and run contract tests
              working-directory: library/examples/localization-sim
              run: ./gradlew test build
