<div id="updateModal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/60 backdrop-blur-sm">
    <div class="bg-[#1f1f1f] border-2 border-[#414141] rounded-[15px] p-6 w-96 shadow-2xl flex flex-col items-center">
        <h3 class="text-xl font-bold text-yellow-400 mb-4 text-center">Update System</h3>
        
        <div id="updateModalContent" class="text-gray-300 text-center mb-6">
            <p class="mb-2">This will pull the latest updates from GitHub, run OS updates (apt-get), and restart the system service.</p>
            <p class="text-red-400 text-sm">Are you sure you want to proceed?</p>
        </div>

        <div id="updateModalProgress" class="hidden w-full mb-6">
            <p class="text-gray-300 text-center mb-4">Updating and restarting...</p>
            <!-- Indeterminate Progress Bar -->
            <div class="w-full h-2 bg-[#2a2a2a] rounded-full overflow-hidden relative">
                <div class="absolute top-0 bottom-0 left-0 bg-yellow-400 w-1/2 rounded-full animate-[progress_1s_ease-in-out_infinite]" style="transform-origin: 0% 50%"></div>
            </div>
        </div>

        <div id="updateModalActions" class="flex gap-4 w-full">
            <button id="updateCancelBtn" class="flex-1 px-4 py-2 bg-[#2a2a2a] text-gray-300 rounded-md border border-[#414141] font-semibold hover:bg-[#3a3a3a] transition-colors" onclick="closeUpdateModal()">Cancel</button>
            <button id="updateConfirmBtn" class="flex-1 px-4 py-2 bg-yellow-500 text-black rounded-md border border-yellow-600 font-bold hover:bg-yellow-400 transition-colors" onclick="startSystemUpdate()">Update</button>
        </div>
    </div>
</div>
<style>
@keyframes progress {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
}
</style>
