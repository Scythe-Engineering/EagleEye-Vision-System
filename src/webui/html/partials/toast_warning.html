<div
    id="toast-warning"
    class="flex items-center w-full max-w-xs p-4 text-gray-200 bg-[#1f1f1f] rounded-lg border-y border-r border-[#414141] border-l-4 border-l-orange-500/50 shadow-[0_10px_15px_-3px_rgba(0,0,0,0.5),0_4px_6px_-2px_rgba(0,0,0,0.3)]"
    role="alert"
>
    <div
        class="inline-flex items-center justify-center shrink-0 w-8 h-8 text-orange-400 bg-orange-900/30 rounded-lg"
    >
        <svg
            class="w-5 h-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 20 20"
        >
            <path
                d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM10 15a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm1-4a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v5Z"
            />
        </svg>
        <span class="sr-only">Warning icon</span>
    </div>
    <div class="ms-3 text-sm font-normal flex-1 break-words">-Replace with message-</div>
    <button
        type="button"
        class="ms-auto -mx-1.5 -my-1.5 bg-[#1f1f1f] text-gray-400 hover:text-gray-200 rounded-lg focus:ring-2 focus:ring-gray-600 p-1.5 hover:bg-[#2a2a2a] inline-flex items-center justify-center h-8 w-8 transition-colors duration-200"
        data-dismiss-target="#toast-warning"
        aria-label="Close"
    >
        <span class="sr-only">Close</span>
        <svg
            class="w-3 h-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 14 14"
        >
            <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
            />
        </svg>
    </button>
</div>
