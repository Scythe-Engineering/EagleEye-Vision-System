<!-- Settings view -->
<div id="view-settings" class="view hidden">
    <div
        class="text-gray-200 bg-[#1f1f1f] max-w-[400px] mx-auto p-5 rounded-[15px] border-2 border-[#414141]"
    >
        <h2 class="text-center text-yellow-400 mb-5 text-2xl font-bold">
            Backend Settings (scrollable)
        </h2>
        <form
            id="settingsForm"
            class="[&>fieldset]:bg-[#1E1E1E] [&>fieldset]:border-2 [&>fieldset]:border-[#414141] [&>fieldset]:mb-4 [&>fieldset]:p-4 [&>fieldset]:rounded-[15px] [&_legend]:text-[#f9c84a] [&_legend]:font-bold [&_legend]:px-2 [&_legend]:text-yellow-400 [&_input]:bg-[#2a2a2a] [&_input]:border-2 [&_input]:border-[#414141] [&_input]:text-[#f9c84a] [&_input]:accent-[#f9c84a] [&_input]:mr-2 [&_label]:flex [&_label]:justify-between [&_label]:items-center [&_label]:mb-2 [&_label]:text-sm [&_input[type='text'],&_input[type='number']]:w-3/5 [&_input[type='text'],&_input[type='number']]:p-1 [&_input[type='text'],&_input[type='number']]:border [&_input[type='text'],&_input[type='number']]:rounded max-h-[70vh] overflow-y-auto"
        >
            <fieldset>
                <legend>General</legend>
                <label>
                    <span>Enable Logging</span>
                    <input
                        type="checkbox"
                        id="logCheckbox"
                        autocomplete="off"
                        data-form-type="other"
                    />
                </label>
                <label>
                    <span>Print to Terminal</span>
                    <input
                        type="checkbox"
                        id="printTerminalCheckbox"
                        checked
                        autocomplete="off"
                        data-form-type="other"
                    />
                </label>
                <label>
                    <span>Detection Logging</span>
                    <input
                        type="checkbox"
                        id="detectionLoggingCheckbox"
                        autocomplete="off"
                        data-form-type="other"
                    />
                </label>
                <label>
                    <span>Simulation Mode</span>
                    <input
                        type="checkbox"
                        id="simulationModeCheckbox"
                        checked
                        autocomplete="off"
                        data-form-type="other"
                    />
                </label>
            </fieldset>
            <fieldset>
                <legend>Network Table</legend>
                <label>
                    <span>Server Address:</span>
                    <input
                        type="text"
                        id="serverAddressInput"
                        value="10.0.0.62"
                        autocomplete="off"
                        data-form-type="other"
                    />
                </label>
                <label>
                    <span>Robot Position Key:</span>
                    <input
                        type="text"
                        id="robotPositionKeyInput"
                        value="robot_position"
                        autocomplete="off"
                        data-form-type="other"
                    />
                </label>
                <label>
                    <span>Robot Rotation Key:</span>
                    <input
                        type="text"
                        id="robotRotationKeyInput"
                        value="robot_rotation"
                        autocomplete="off"
                        data-form-type="other"
                    />
                </label>
            </fieldset>

            <button
                type="button"
                id="saveSettingsBtn"
                class="block w-full p-2.5 bg-[#2a2a2a] text-[#f9c845] rounded-md border border-[#414141] cursor-pointer text-base font-semibold hover:bg-[#3a3a3a] hover:border-[#f9c845] transition-colors duration-200"
            >
                Save Settings
            </button>
            <button
                type="button"
                id="restartBackendBtn"
                class="block w-full p-2.5 bg-red-900 text-white rounded-md border border-red-700 cursor-pointer text-base font-semibold hover:bg-red-800 hover:border-red-600 transition-colors duration-200 mt-3"
                onclick="restartBackend()"
            >
                Restart Backend
            </button>
        </form>
    </div>
</div>
