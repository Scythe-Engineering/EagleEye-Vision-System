<div id="view-first-boot" class="view hidden h-full overflow-y-auto p-4">
    <main
        class="mx-auto max-w-4xl rounded-[15px] border-2 border-[#414141] bg-[#1f1f1f] p-6 text-gray-200"
        aria-labelledby="firstBootTitle"
    >
        <header class="mb-5 flex items-start justify-between gap-4">
            <div>
                <p class="mb-1 text-sm font-semibold text-[#ac8a2f]">
                    Guided setup
                </p>
                <h1
                    id="firstBootTitle"
                    class="text-2xl font-bold text-[#f9c845]"
                >
                    First-boot wizard
                </h1>
            </div>
            <button
                id="firstBootCloseBtn"
                type="button"
                class="rounded-md border border-[#414141] px-3 py-2 text-sm text-gray-200 hover:border-[#f9c845] focus:outline-none focus:ring-2 focus:ring-[#f9c845]"
            >
                Close
            </button>
        </header>
        <div
            id="firstBootProgress"
            class="mb-5 text-sm text-[#ac8a2f]"
            aria-live="polite"
        ></div>
        <section
            id="firstBootContent"
            aria-live="polite"
        ></section>
    </main>
</div>
