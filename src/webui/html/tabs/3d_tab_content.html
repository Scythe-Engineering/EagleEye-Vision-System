<!-- 3D View (WebGL model will load here) -->
<div
    id="view-3d"
    class="w-full h-full min-w-0 bg-[#1f1f1f] rounded-[15px] border-2 border-[#414141] overflow-hidden relative hidden z-10"
    style="box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.4);"
>
    <div
        id="fieldDropdown"
        class="flex flex-col bg-[#1E1E1E] border-2 text-[rgb(249,200,74)] max-w-[200px] mt-2.5 mb-0 mx-2.5 p-4 rounded-[15px] border-[#414141] z-10"
        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
    >
        <label for="yearSelect" class="font-bold mb-1">Year:</label>
        <select
            id="yearSelect"
            class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] border-2 text-base mb-3 p-1 rounded-md border-solid border-[#414141] hover:bg-[#3a3a3a] focus:outline-none focus:border-[#f9c845]"
        >
            <option disabled selected>Select Year</option>
        </select>
        <label for="fieldFileSelect" class="font-bold mb-1">Field File:</label>
        <select
            id="fieldFileSelect"
            class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] border-2 text-base p-1 rounded-md border-solid border-[#414141] hover:bg-[#3a3a3a] focus:outline-none focus:border-[#f9c845]"
        >
            <option disabled selected>Select Field File</option>
        </select>
    </div>

    <div
        id="robotDropdown"
        class="flex flex-col bg-[#1E1E1E] border-2 text-[rgb(249,200,74)] max-w-[200px] mt-2.5 mb-0 mx-2.5 p-4 rounded-[15px] border-[#414141] z-10"
        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
    >
        <label for="robotFileSelect" class="font-bold mb-1">Robot File:</label>
        <select
            id="robotFileSelect"
            class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] border-2 text-base p-1 rounded-md border-solid border-[#414141] hover:bg-[#3a3a3a] focus:outline-none focus:border-[#f9c845]"
        >
            <option disabled selected>Select Robot File</option>
        </select>
    </div>

    <button
        id="toggleGamePiecesBtn"
        class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] w-[180px] block mt-2.5 mb-0 mx-2.5 px-3 py-2 rounded-md border border-[#414141] font-semibold hover:bg-[#3a3a3a] hover:border-[#f9c845] transition-colors duration-200 z-10"
        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
    >
        Toggle Game Pieces
    </button>
    <button
        id="toggleShadowBtn"
        class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] w-[180px] block mt-2.5 mb-0 mx-2.5 px-3 py-2 rounded-md border border-[#414141] font-semibold hover:bg-[#3a3a3a] hover:border-[#f9c845] transition-colors duration-200 z-10"
        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
    >
        Toggle Shadows
    </button>    

    <div
        id="statsDisplay"
        class="[text-shadow:rgb(0,0,0)_1px_1px_2px] [font-family:Arial,sans-serif] font-bold"
    ></div>
</div>
