<!-- 3D View (WebGL model will load here) -->
<div
    id="view-3d"
    class="w-full h-full min-w-0 bg-[#1f1f1f] rounded-[15px] border-2 border-[#414141] overflow-hidden relative hidden z-10"
    style="box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.4)"
>
    <div
        id="fieldDropdown"
        class="flex flex-col bg-[#1E1E1E] border-2 text-[rgb(249,200,74)] max-w-[200px] mt-2.5 mb-0 mx-2.5 p-4 rounded-[15px] border-[#414141] z-10"
        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4)"
    >
        <label for="yearSelect" class="font-bold mb-1">Year:</label>
        <select
            id="yearSelect"
            class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] border-2 text-base mb-3 p-1 rounded-md border-solid border-[#414141] hover:bg-[#3a3a3a] focus:outline-none focus:border-[#f9c845]"
        >
            <option disabled selected>Select Year</option>
        </select>
        <label for="fieldFileSelect" class="font-bold mb-1">Field File:</label>
        <select
            id="fieldFileSelect"
            class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] border-2 text-base p-1 rounded-md border-solid border-[#414141] hover:bg-[#3a3a3a] focus:outline-none focus:border-[#f9c845]"
        >
            <option disabled selected>Select Field File</option>
        </select>
    </div>

    <div
        id="robotDropdown"
        class="flex flex-col bg-[#1E1E1E] border-2 text-[rgb(249,200,74)] max-w-[200px] mt-2.5 mb-0 mx-2.5 p-4 rounded-[15px] border-[#414141] z-10"
        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4)"
    >
        <label for="robotFileSelect" class="font-bold mb-1">Robot File:</label>
        <select
            id="robotFileSelect"
            class="text-[rgb(249,200,74)] cursor-pointer bg-[#2a2a2a] border-2 text-base p-1 rounded-md border-solid border-[#414141] hover:bg-[#3a3a3a] focus:outline-none focus:border-[#f9c845]"
        >
            <option disabled selected>Select Robot File</option>
        </select>
    </div>

    <div
        id="viewToggles"
        class="flex flex-col bg-[#1E1E1E] border-2 text-[rgb(249,200,74)] max-w-[200px] mt-2.5 mb-0 mx-2.5 p-4 rounded-[15px] border-[#414141] z-10"
        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4)"
    >
        <label
            class="flex justify-between items-center mb-2 cursor-pointer font-bold text-sm"
        >
            <span>Game Pieces:</span>
            <input
                type="checkbox"
                id="toggleGamePiecesBtn"
                checked
                class="accent-[#f9c84a] cursor-pointer"
            />
        </label>
        <label
            class="flex justify-between items-center mb-2 cursor-pointer font-bold text-sm"
        >
            <span>Robot model:</span>
            <input
                type="checkbox"
                id="toggleRobotModelBtn"
                checked
                class="accent-[#f9c84a] cursor-pointer"
            />
        </label>
        <label
            class="flex justify-between items-center mb-2 cursor-pointer font-bold text-sm"
        >
            <span>Cameras:</span>
            <input
                type="checkbox"
                id="toggleCamerasBtn"
                checked
                class="accent-[#f9c84a] cursor-pointer"
            />
        </label>
        <label
            class="flex justify-between items-center cursor-pointer font-bold text-sm"
        >
            <span>Shadows:</span>
            <input
                type="checkbox"
                id="toggleShadowBtn"
                checked
                class="accent-[#f9c84a] cursor-pointer"
            />
        </label>
    </div>

    <output
        id="threeDLoadingOverlay"
        class="absolute inset-0 z-20 flex items-center justify-center bg-[rgba(20,20,20,0.82)] text-[#f9c84a] hidden"
        aria-live="polite"
        aria-busy="true"
    >
        <div class="three-d-loading-panel">
            <div class="three-d-loading-spinner" aria-hidden="true"></div>
            <div class="three-d-loading-text">
                <div class="font-bold">Loading 3D view</div>
                <div id="threeDLoadingStatus" class="text-sm text-[#f3f3f3]">
                    Preparing assets...
                </div>
                <progress
                    id="threeDLoadingProgress"
                    class="three-d-loading-progress"
                    max="100"
                    value="0"
                    aria-label="3D asset loading progress"
                ></progress>
            </div>
        </div>
    </output>

    <aside
        id="firstBootVerificationPanel"
        class="absolute right-3 top-3 z-30 hidden w-80 rounded-lg border border-[#f9c845]/50 bg-[#171717]/95 p-4 text-sm text-gray-200 shadow-xl"
        aria-labelledby="firstBootVerificationTitle"
        aria-live="polite"
        tabindex="-1"
    >
        <h2
            id="firstBootVerificationTitle"
            class="mb-2 text-lg font-bold text-[#f9c845]"
        >
            Verify live output
        </h2>
        <p class="mb-3 text-xs text-[#ac8a2f]">
            Place a 2026 AprilTag in view. The robot should move on this field.
        </p>
        <dl class="space-y-2">
            <div class="flex justify-between gap-3">
                <dt>NetworkTables</dt>
                <dd id="firstBootVerifyNetworkTables">Checking...</dd>
            </div>
            <div class="flex justify-between gap-3">
                <dt>Pipelines</dt>
                <dd id="firstBootVerifyPipelines">Checking...</dd>
            </div>
        </dl>
        <div class="mt-3">
            <h3 class="mb-1 font-semibold text-[#f9c845]">Published keys</h3>
            <ul id="firstBootVerifyKeys" class="space-y-1 text-xs"></ul>
        </div>
        <p id="firstBootVerifyHint" class="mt-3 text-xs text-[#ac8a2f]"></p>
        <div class="mt-4 flex flex-wrap gap-2">
            <button
                id="firstBootVerifyRetryBtn"
                type="button"
                class="rounded-md border border-[#414141] px-3 py-2 hover:border-[#f9c845] focus:outline-none focus:ring-2 focus:ring-[#f9c845]"
            >
                Check again
            </button>
            <button
                id="firstBootVerifySetupBtn"
                type="button"
                class="rounded-md border border-[#414141] px-3 py-2 hover:border-[#f9c845] focus:outline-none focus:ring-2 focus:ring-[#f9c845]"
            >
                Reopen setup
            </button>
            <button
                id="firstBootVerifyFinishBtn"
                type="button"
                disabled
                class="rounded-md bg-[#f9c845] px-3 py-2 font-semibold text-black hover:bg-[#d4a83a] focus:outline-none focus:ring-2 focus:ring-white disabled:cursor-not-allowed disabled:opacity-50"
            >
                Finish
            </button>
        </div>
    </aside>

    <div
        id="statsDisplay"
        class="[text-shadow:rgb(0,0,0)_1px_1px_2px] [font-family:Arial,sans-serif] font-bold"
    ></div>
</div>
