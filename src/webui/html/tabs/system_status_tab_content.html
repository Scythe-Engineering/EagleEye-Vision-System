<div id="view-system" class="view hidden flex flex-1 min-h-0">
    <div class="h-full min-h-0 bg-transparent text-white flex-1">
        <div class="flex h-full min-h-0 gap-4 p-0">
            <div
                class="flex-1 flex flex-col bg-[#1f1f1f] rounded-[15px] min-h-0 mt-[5px]"
                style="box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.4);"
            >
                <div
                    class="bg-[#1E1E1E] p-4 border-b border-[#414141] flex items-center justify-between rounded-[15px]"
                    style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
                >
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col gap-2">
                            <div class="flex items-center gap-4">
                                <h1 class="text-2xl font-bold text-[#f9c845]">
                                    System Status
                                </h1>
                            </div>
                            <div class="flex items-center gap-4">
                                <p class="text-[#ac8a2f] mt-1">
                                    Live resource usage and pipeline activity
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-1 min-h-0 p-4 flex gap-4">
                    <div
                        class="w-1/2 bg-[#1E1E1E] border border-[#414141] rounded-[15px] flex flex-col min-h-0"
                        style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
                    >
                        <div
                            class="px-4 py-3 border-b border-[#414141] flex items-center justify-between"
                        >
                            <h2 class="text-lg font-bold text-[#f9c845]">
                                Pipelines
                            </h2>
                            <span
                                id="systemPipelineCount"
                                class="text-xs text-[#ac8a2f]"
                                >0 active</span
                            >
                        </div>
                        <div
                            id="systemPipelineList"
                            class="flex-1 min-h-0 overflow-auto p-4 space-y-2"
                        ></div>
                    </div>

                    <div class="w-1/2 grid grid-cols-1 grid-rows-3 gap-4 min-h-0">
                        <div
                            class="bg-[#1E1E1E] border border-[#414141] rounded-[15px] p-4 flex flex-col"
                            style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
                        >
                            <div class="flex items-center justify-between h-full">
                                <div class="flex flex-col justify-center h-full">
                                    <p class="text-[#f9c845] text-sm font-semibold">
                                        CPU
                                    </p>
                                    <p
                                        id="systemCpuPercent"
                                        class="text-3xl font-bold text-white mt-2"
                                    >
                                        --
                                    </p>
                                    <p
                                        id="systemCpuDetail"
                                        class="text-sm text-[#ac8a2f] mt-1"
                                    >
                                        Cores: --
                                    </p>
                                    <p
                                        id="systemCpuTemperature"
                                        class="text-sm text-[#ac8a2f] mt-1"
                                    >
                                        Temp: --
                                    </p>
                                </div>
                                <div class="relative h-full aspect-square">
                                    <svg
                                        class="w-full h-full"
                                        viewBox="0 0 36 36"
                                    >
                                        <path
                                            class="text-[#2a2a2a]"
                                            stroke="currentColor"
                                            stroke-width="3"
                                            fill="none"
                                            d="M18 3 a 15 15 0 1 1 0 30 a 15 15 0 1 1 0 -30"
                                        ></path>
                                        <path
                                            id="systemCpuDial"
                                            class="text-[#f9c845]"
                                            stroke="currentColor"
                                            stroke-width="3"
                                            fill="none"
                                            stroke-linecap="round"
                                            stroke-dasharray="0, 100"
                                            d="M18 3 a 15 15 0 1 1 0 30 a 15 15 0 1 1 0 -30"
                                        ></path>
                                    </svg>
                                    <div
                                        id="systemCpuDialValue"
                                        class="absolute inset-0 flex items-center justify-center text-xs font-semibold text-white"
                                    >
                                        --
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div
                            class="bg-[#1E1E1E] border border-[#414141] rounded-[15px] p-4 flex flex-col"
                            style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
                        >
                            <div class="flex items-center justify-between h-full">
                                <div class="flex flex-col justify-center h-full">
                                    <p class="text-[#f9c845] text-sm font-semibold">
                                        RAM
                                    </p>
                                    <p
                                        id="systemMemoryPercent"
                                        class="text-3xl font-bold text-white mt-2"
                                    >
                                        --
                                    </p>
                                    <p
                                        id="systemMemoryDetail"
                                        class="text-sm text-[#ac8a2f] mt-1"
                                    >
                                        --
                                    </p>
                                </div>
                                <div class="relative h-full aspect-square">
                                    <svg
                                        class="w-full h-full"
                                        viewBox="0 0 36 36"
                                    >
                                        <path
                                            class="text-[#2a2a2a]"
                                            stroke="currentColor"
                                            stroke-width="3"
                                            fill="none"
                                            d="M18 3 a 15 15 0 1 1 0 30 a 15 15 0 1 1 0 -30"
                                        ></path>
                                        <path
                                            id="systemMemoryDial"
                                            class="text-[#f9c845]"
                                            stroke="currentColor"
                                            stroke-width="3"
                                            fill="none"
                                            stroke-linecap="round"
                                            stroke-dasharray="0, 100"
                                            d="M18 3 a 15 15 0 1 1 0 30 a 15 15 0 1 1 0 -30"
                                        ></path>
                                    </svg>
                                    <div
                                        id="systemMemoryDialValue"
                                        class="absolute inset-0 flex items-center justify-center text-xs font-semibold text-white"
                                    >
                                        --
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div
                            class="bg-[#1E1E1E] border border-[#414141] rounded-[15px] p-4 flex flex-col"
                            style="box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);"
                        >
                            <div class="flex items-center justify-between h-full">
                                <div class="flex flex-col justify-center h-full">
                                    <p class="text-[#f9c845] text-sm font-semibold">
                                        Storage
                                    </p>
                                    <p
                                        id="systemStoragePercent"
                                        class="text-3xl font-bold text-white mt-2"
                                    >
                                        --
                                    </p>
                                    <p
                                        id="systemStorageDetail"
                                        class="text-sm text-[#ac8a2f] mt-1"
                                    >
                                        --
                                    </p>
                                </div>
                                <div class="relative h-full aspect-square">
                                    <svg
                                        class="w-full h-full"
                                        viewBox="0 0 36 36"
                                    >
                                        <path
                                            class="text-[#2a2a2a]"
                                            stroke="currentColor"
                                            stroke-width="3"
                                            fill="none"
                                            d="M18 3 a 15 15 0 1 1 0 30 a 15 15 0 1 1 0 -30"
                                        ></path>
                                        <path
                                            id="systemStorageDial"
                                            class="text-[#f9c845]"
                                            stroke="currentColor"
                                            stroke-width="3"
                                            fill="none"
                                            stroke-linecap="round"
                                            stroke-dasharray="0, 100"
                                            d="M18 3 a 15 15 0 1 1 0 30 a 15 15 0 1 1 0 -30"
                                        ></path>
                                    </svg>
                                    <div
                                        id="systemStorageDialValue"
                                        class="absolute inset-0 flex items-center justify-center text-xs font-semibold text-white"
                                    >

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
