<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Eagle Eye</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body
        class="background [background:url('./static/background.webp')_50%_center_/_cover_no-repeat_fixed] w-full h-full [font-family:Arial,sans-serif]"
    >
        <!-- Connection Lost Overlay -->
        <div
            id="connection-lost-overlay"
            class="fixed inset-0 bg-black opacity-75 flex items-center justify-center z-50 hidden"
        >
            <div
                class="bg-[#1b1b1b] text-[#fdc700] px-8 py-6 rounded-lg shadow-lg text-center"
            >
                <h2 class="text-2xl font-bold mb-2">Connection Lost</h2>
                <p class="text-lg">Attempting to reconnect...</p>
                <div
                    class="animate-spin rounded-full h-8 w-8 border-b-2 border-white mx-auto mt-4"
                ></div>
            </div>
        </div>

        <!-- Notification Container -->
        <div
            class="fixed top-4 right-4 z-40 flex flex-col items-end gap-2 pointer-events-none"
        >
            <button
                id="clearAllNotificationsBtn"
                type="button"
                class="hidden px-3 py-1 bg-[#2a2a2a] text-[#f9c845] rounded-md border border-[#414141] cursor-pointer text-sm font-semibold hover:bg-[#3a3a3a] hover:border-[#f9c845] transition-colors duration-200 pointer-events-auto mb-2"
            >
                Clear All
            </button>
            <div
                id="notification-container"
                class="relative pointer-events-auto"
                style="min-width: 320px;"
            ></div>
        </div>

        <div
            class="main-container bg-[rgb(27,27,27)] flex-col w-[calc(100%_-_20px)] h-[calc(-20px_+_100vh)] flex overflow-hidden shadow-[rgba(0,0,0,0.6)_0px_4px_15px] m-2.5 rounded-lg"
        >
            <!-- HEADER -->
            <div
                class="Header text-[rgb(249,200,74)] text-[2rem] font-bold px-5 py-2.5"
            >
                EAGLE EYE
            </div>

            <!-- CONTENT: Left view area and right sidebar -->
            <div class="Content flex-1 gap-2.5 flex overflow-hidden p-5">
                <!-- LEFT CONTENT -->
                <div class="Left-Content flex-col flex-1 flex relative">
                    {{> camera_views_tab_content}} {{> 3d_tab_content}} {{>
                    pipeline_tab_content}} {{> settings_tab_content}} {{>
                    system_status_tab_content}} {{> utils_tab_content}}
                </div>

                <!-- SIDEBAR -->
                <nav class="sidebar p-0 w-[200px] bg-[#1b1b1b] overflow-y-auto">
                    <ul class="list-none">
                        <li class="active" data-view="view-views">Views</li>
                        <li data-view="view-3d">3D View</li>
                        <li data-view="view-pipeline">Pipeline</li>
                        <li data-view="view-system">System</li>
                        <li data-view="view-settings">Settings</li>
                        <li data-view="view-utils">Utils</li>
                    </ul>
                </nav>
            </div>
        </div>

        <script type="module" src="/js/main.js"></script>
    </body>
</html>
