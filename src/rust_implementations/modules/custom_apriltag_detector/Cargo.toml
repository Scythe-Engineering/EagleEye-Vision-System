[package]
name = "custom_apriltag_detector"
version = "0.1.0"
edition = "2021"

[lib]
name = "custom_apriltag_detector"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.29.0"
rayon = "1.10"

[package.metadata.maturin]
features = ["extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
