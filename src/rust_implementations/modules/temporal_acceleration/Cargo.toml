[package]
name = "temporal_acceleration"
version = "0.1.0"
edition = "2021"

[lib]
name = "temporal_acceleration"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-traits = "0.2"
