[package]
name = "pose_outlier_filter"
version = "0.1.0"
edition = "2021"

[lib]
name = "pose_outlier_filter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26.0", features = ["extension-module"] }
ndarray = "0.16"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
